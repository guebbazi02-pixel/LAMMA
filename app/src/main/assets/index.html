<!DOCTYPE html>
<html lang="ar-DZ" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لمّة Lamma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one quiet phone-width column in sand neutrals with a single ochre accent; no borders, icons instead of labels. Faces are plain circles; the only ornament kept from Timimoun is the date palm. */
:root{
  --bg:#F6F1EA; --surface:#FCFAF6; --ink:#2E2925; --muted:#756D65; --line:#E7DFD4; --wall:#FCFAF6; --wall-ink:#2E2925;
  --accent:#9A4A32; --accent-ink:#FFF8F2; --soft:#F0E6DC; --hot:#9A4A32; --sun:#9A4A32;
  --display:"Reem Kufi","Readex Pro",Tahoma,sans-serif;
  --body:"Readex Pro",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171513; --surface:#1F1C19; --ink:#E8E2D9; --muted:#A39A8F; --line:#322D28; --wall:#1F1C19; --wall-ink:#E8E2D9;
    --accent:#D08A6E; --accent-ink:#1F100A; --soft:#2A2420; --hot:#D08A6E; --sun:#D08A6E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171513; --surface:#1F1C19; --ink:#E8E2D9; --muted:#A39A8F; --line:#322D28; --wall:#1F1C19; --wall-ink:#E8E2D9;
  --accent:#D08A6E; --accent-ink:#1F100A; --soft:#2A2420; --hot:#D08A6E; --sun:#D08A6E; color-scheme:dark;
}
:root.t-light{
  --bg:#F6F1EA; --surface:#FCFAF6; --ink:#2E2925; --muted:#756D65; --line:#E7DFD4; --wall:#FCFAF6; --wall-ink:#2E2925;
  --accent:#9A4A32; --accent-ink:#FFF8F2; --soft:#F0E6DC; --hot:#9A4A32; --sun:#9A4A32; color-scheme:light;
}
:root.t-dark{
  --bg:#171513; --surface:#1F1C19; --ink:#E8E2D9; --muted:#A39A8F; --line:#322D28; --wall:#1F1C19; --wall-ink:#E8E2D9;
  --accent:#D08A6E; --accent-ink:#1F100A; --soft:#2A2420; --hot:#D08A6E; --sun:#D08A6E; color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{font-size:16px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:1.35rem;height:1.35rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir="rtl"] .flip{transform:scaleX(-1)}

.app{height:100%;max-width:540px;margin-inline:auto;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg);border-inline:1px solid var(--line);position:relative;overflow:hidden}
header{background:var(--wall);color:var(--wall-ink)}
header .iconbtn{color:var(--wall-ink)}
header .iconbtn:hover{background:var(--soft)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:8px;margin-inline-end:auto}
.brand svg{width:24px;height:24px;fill:none;stroke:var(--sun);stroke-width:2;stroke-linecap:round}
.brand b{font-family:var(--display);font-weight:500;font-size:1.25rem;line-height:1;letter-spacing:0}
.iconbtn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.iconbtn:hover{background:var(--soft)}
.band{height:1px;background:var(--line)}

main{overflow-y:auto;overflow-x:hidden;padding:12px 12px 24px;display:flex;flex-direction:column;gap:12px}
main>*{flex-shrink:0}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:.68rem;color:var(--muted);position:relative}
nav button[aria-current="page"]{color:var(--accent);font-weight:600}
nav button[aria-current="page"]::before{content:"";position:absolute;top:0;inset-inline:28%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
.dot{position:absolute;top:6px;inset-inline-start:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--hot)}

.card{background:var(--surface);border-radius:var(--r);padding:14px}
.note{font-size:.78rem;color:var(--muted);padding:8px 12px;border-inline-start:3px solid var(--sun);background:var(--surface);border-radius:6px}
h2{font-family:var(--display);font-weight:500;font-size:1.05rem;text-wrap:balance}

/* faces: plain circles */
.av{--s:42px;width:var(--s);height:var(--s);flex:none;display:grid;place-items:center;background:var(--c,var(--accent));color:#fff;font-family:var(--display);font-weight:700;font-size:calc(var(--s)*.42);border-radius:50%}
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.story{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);flex:none;max-width:66px}
.story .ring{padding:2px;border:2px solid var(--sun);border-radius:50%}
.story.seen .ring{border-color:var(--line)}
.story .av{--s:52px}
.story span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.composer{display:flex;flex-direction:column;gap:10px}
.composer .row{display:flex;gap:10px;align-items:flex-start}
textarea,input[type=text],input[type=search],input[type=number],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:none}
textarea::placeholder,input::placeholder{color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:99px;font-size:.82rem;color:var(--muted);background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--soft);color:var(--accent);border-color:var(--accent)}
.chip .ic{width:1.05rem;height:1.05rem}
.btn{display:inline-flex;gap:6px;align-items:center;background:var(--accent);color:var(--accent-ink);padding:8px 20px;border-radius:99px;font-weight:600;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.sm{padding:5px 14px;font-size:.8rem}
.push{margin-inline-start:auto}
.preview{position:relative;align-self:flex-start}
.preview img{max-width:100%;max-height:180px;border-radius:10px;display:block}

.post{display:flex;flex-direction:column;gap:10px;padding:14px 14px 6px}
.post .head{display:flex;gap:10px;align-items:center}
.who{flex:1;min-width:0;line-height:1.35}
.who b{font-weight:600;display:block;overflow-wrap:anywhere}
.who small{color:var(--muted);font-size:.76rem}
.post p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:1rem}
.media{border-radius:10px;overflow:hidden;background:var(--bg)}
.media svg,.media img{display:block;width:100%;max-width:100%;height:auto}
.veil{width:100%;padding:26px 12px;display:flex;gap:8px;justify-content:center;align-items:center;color:var(--muted);font-size:.85rem;border:1px dashed var(--line);border-radius:10px}
.acts{display:flex;margin-inline:-4px}
.acts button{flex:1;display:flex;gap:6px;align-items:center;justify-content:center;padding:9px 2px;font-size:.8rem;color:var(--muted);border-radius:8px}
.acts button:hover{background:var(--bg)}
.acts .on{color:var(--hot);font-weight:600}
.acts .on .ic{stroke-width:2.6}
.acts .on.sv{color:var(--accent)}
.acts .on.sv .ic{fill:var(--accent)}
@keyframes pop{0%{transform:scale(.6) rotate(-45deg)}60%{transform:scale(1.3) rotate(10deg)}100%{transform:none}}
.num{font-variant-numeric:tabular-nums}
.menu{position:relative}
.menu .pop{position:absolute;inset-inline-end:0;top:40px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:200px;padding:4px}
.menu .pop button{display:block;width:100%;text-align:start;padding:10px 12px;border-radius:8px;font-size:.88rem}
.menu .pop button:hover{background:var(--bg)}
.cmts{display:flex;flex-direction:column;gap:8px;padding-bottom:10px}
.cm{display:flex;gap:8px;align-items:flex-start}
.cm .av{--s:28px}
.cm div{background:var(--bg);border-radius:12px;padding:6px 12px;font-size:.88rem;overflow-wrap:anywhere;min-width:0}
.cm b{font-weight:600;font-size:.8rem;display:block}
.inline{display:flex;gap:8px;align-items:center}
.inline input{flex:1;min-width:0;border-radius:99px}
.sendbtn{width:40px;height:40px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}

.rowi{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.rowi:last-child{border-bottom:0}
.rowi .who small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{padding:4px 14px}
.unread{width:9px;height:9px;border-radius:50%;background:var(--hot);flex:none}

.chat{display:flex;flex-direction:column;gap:8px;flex:1}
.chathead{display:flex;align-items:center;gap:10px}
.bub{max-width:78%;padding:8px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chatform{position:sticky;bottom:-24px;background:var(--bg);padding:8px 0 12px;margin-top:auto;display:flex;flex-direction:column;gap:8px}

.profile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:22px 16px}
.profile .av{--s:84px}
.profile h1{font-family:var(--display);font-weight:700;font-size:1.5rem;overflow-wrap:anywhere}
.profile p{color:var(--muted);font-size:.9rem;max-width:34ch;overflow-wrap:anywhere}
.stats{display:flex;gap:28px;font-size:.8rem;color:var(--muted)}
.stats b{display:block;color:var(--ink);font-size:1.15rem;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;padding:7px 10px;border-radius:99px;font-size:.84rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:.9rem}

.overlay{position:absolute;inset:0;z-index:20;background:rgba(8,12,26,.55);display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px}
.sheet .bar{display:flex;align-items:center;justify-content:space-between}
.sheet h2{font-size:1.3rem;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>span{font-size:.82rem;color:var(--muted);font-weight:500}
.sw{display:flex;align-items:center;gap:12px;width:100%;text-align:start}
.sw div{flex:1}
.sw small{display:block;color:var(--muted);font-size:.78rem}
.sw i{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:inset-inline-start .15s}
.sw[aria-checked="true"] i{background:var(--accent)}
.sw[aria-checked="true"] i::after{inset-inline-start:23px}
.storyview{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;padding:16px;color:#fff;background:var(--c)}
.storyview .prog{height:3px;background:rgba(255,255,255,.3);border-radius:3px;overflow:hidden}
.storyview .prog i{display:block;height:100%;background:#fff;width:100%}
@media (prefers-reduced-motion:no-preference){ .storyview .prog i{animation:run 6s linear} }
@keyframes run{from{width:0}}
.storyview .head{display:flex;align-items:center;gap:10px;padding-top:12px}
.storyview .head b{flex:1}
.storyview .av{background:rgba(255,255,255,.22)}
.storyview .txt{flex:1;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,7vw,2.4rem);line-height:1.5;padding:16px;text-wrap:balance;overflow-wrap:anywhere}
.storyview .iconbtn{color:#fff}
.toast{position:absolute;z-index:40;bottom:76px;inset-inline:16px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;font-size:.88rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{margin-inline-start:auto;font-weight:600;text-decoration:underline;color:inherit}
.btn .ic{width:1.1rem;height:1.1rem}
input[type=range]{width:100%;accent-color:var(--accent)}
.big{font-family:var(--display);font-size:1.6rem;font-weight:700}
/* reels */
main.full{padding:0;gap:0;scroll-snap-type:y mandatory}
.reel{flex:0 0 100%;height:100%;position:relative;scroll-snap-align:start;overflow:hidden;background:#211A15;color:#fff;display:flex}
.reel .scene{position:absolute;inset:0}
.reel .scene svg{width:100%;height:100%;display:block}
@media (prefers-reduced-motion:no-preference){.reel .scene svg{animation:drift 26s ease-in-out infinite alternate}.steps li{animation:glow 9s infinite}.steps li:nth-child(2){animation-delay:3s}.steps li:nth-child(3){animation-delay:6s}}
@keyframes drift{to{transform:scale(1.14)}}
@keyframes glow{0%,100%{opacity:.35}15%,40%{opacity:1}}
.steps{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px 56px;font-family:var(--display);font-size:1.45rem;color:#F3E9DC}
.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.reel .cap{position:relative;margin-top:auto;width:100%;padding:40px 16px 16px;background:linear-gradient(transparent,rgba(0,0,0,.62));display:flex;gap:10px;align-items:flex-end}
.reel .cap p{flex:1;min-width:0;font-size:.95rem;overflow-wrap:anywhere}
.reel .cap b{display:block;font-weight:600}
.rl{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:#fff;background:rgba(0,0,0,.3)}
.rl.on{background:#fff;color:#9A4A32}
.reel .tag{position:absolute;top:12px;inset-inline-start:12px;font-size:.7rem;background:rgba(0,0,0,.4);padding:3px 10px;border-radius:99px}
.reeladd{position:absolute;top:10px;inset-inline-end:12px;z-index:2}
.reel.end{background:var(--bg);color:var(--muted);flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:24px}
/* souk */
.stall{background:var(--surface);border-radius:var(--r);overflow:hidden}
.awn{height:16px;background:radial-gradient(circle at 50% 0,var(--soft) 9px,transparent 9.5px) 0 6px/20px 10px repeat-x,linear-gradient(var(--soft) 6px,transparent 0)}
.shead{display:flex;gap:10px;align-items:center;padding:6px 14px 2px}
.shelf{display:flex;gap:12px;overflow-x:auto;padding:8px 14px 14px;scrollbar-width:thin}
.prod{flex:0 0 132px;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:.88rem}
.prod b{font-weight:500;overflow-wrap:anywhere}
.price{color:var(--accent);font-weight:600}
.pimg{width:132px;height:132px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:2.6rem;overflow:hidden;flex:none}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg.sm{width:52px;height:52px;font-size:1.5rem}
.ulink{display:flex;gap:10px;align-items:center;flex:1;min-width:0;text-align:start}
.quote{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.92rem;overflow-wrap:anywhere}
.quote b{font-weight:600;font-size:.82rem}
.muted{color:var(--muted)}
.gav{--s:42px;width:var(--s);height:var(--s);flex:none;display:grid;place-items:center;border-radius:24%;background:var(--soft);color:var(--accent);font-family:var(--display);font-weight:700;font-size:calc(var(--s)*.42)}
.welcome{align-items:center;padding:16px;background:var(--bg)}
.welcome .sheet{border-radius:22px;max-height:100%}
.col{display:flex;flex-direction:column;gap:10px}
.col .btn{justify-content:center;padding:11px 20px}
.av.ph{padding:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.profile.mine{padding-top:0;overflow:hidden}
.cover{align-self:stretch;margin:0 -16px;height:112px;background:var(--soft);position:relative;display:block}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .chip{position:absolute;bottom:8px;inset-inline-end:8px}
.avbtn{margin-top:-46px;position:relative;z-index:1;border-radius:50%}
.avbtn .av{box-shadow:0 0 0 4px var(--surface)}
.panel{background:var(--surface);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;max-height:250px;overflow-y:auto}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:2px}
.egrid button{font-size:1.4rem;height:42px;border-radius:8px}
.egrid button:hover{background:var(--bg)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.stk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px;border-radius:16px;background:var(--soft);min-width:88px;align-self:flex-start;text-align:center}
.stk span{font-size:2.2rem;line-height:1.25}
.stk b{font-family:var(--display);font-weight:500;font-size:.85rem;color:var(--accent)}
.anim{font-size:3rem;line-height:1.35;align-self:flex-start;padding:6px 12px}
.anim span{display:inline-block}
.sgrid .anim{font-size:2.1rem;background:var(--bg);border-radius:14px;text-align:center}
.cimg{max-width:70%;max-height:240px;border-radius:14px;align-self:flex-start;display:block}
.stk.me,.anim.me,.cimg.me{align-self:flex-end}
@media (prefers-reduced-motion:no-preference){
.an-bounce{animation:a-bounce .8s ease-in-out infinite alternate}.an-pulse{animation:a-pulse .9s ease-in-out infinite alternate}.an-walk{animation:a-walk 1.6s ease-in-out infinite alternate}.an-shake{animation:a-shake .35s linear infinite alternate}.an-spin{animation:a-spin 2.6s linear infinite}.an-wave{animation:a-wave .5s ease-in-out infinite alternate;transform-origin:70% 80%}}
@keyframes a-bounce{to{transform:translateY(-12px)}}
@keyframes a-pulse{to{transform:scale(1.25)}}
@keyframes a-walk{from{transform:translateX(-10px) rotate(-3deg)}to{transform:translateX(10px) rotate(3deg)}}
@keyframes a-shake{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes a-spin{to{transform:rotate(360deg)}}
@keyframes a-wave{from{transform:rotate(-14deg)}to{transform:rotate(18deg)}}
.media video{display:block;width:100%;max-height:420px;background:#000}
.preview video{max-width:100%;max-height:200px;border-radius:10px;display:block}
video.cimg{width:70%;background:#000}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* rooms and games */
.game{display:flex;flex-direction:column;gap:12px}
.game>.btn{align-self:center}
.seats{display:flex;flex-wrap:wrap;justify-content:space-around;gap:6px}
.seat{display:flex;flex-direction:column;align-items:center;font-size:.72rem;gap:2px;min-width:0;opacity:.55}
.seat.on{opacity:1}
.seat.on .av{box-shadow:0 0 0 3px var(--accent)}
.seat b{font-weight:600;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat[style] b{border-bottom:3px solid var(--lc)}
.seat small{color:var(--muted)}
.gst{text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.gst small{color:var(--muted)}
.ctr{justify-content:center}
.dchain{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-items:center;min-height:64px;background:var(--bg);border-radius:10px;padding:10px}
.dt{display:inline-flex;background:#FBF7F0;border:1px solid #BFB5A6;border-radius:5px;color:#2E2925;flex:none}
.dt i{width:20px;height:20px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:3px;gap:1px}
.dt i+i{border-left:1px solid #BFB5A6}
.dt b{border-radius:50%}
.dt b.on{background:currentColor}
.dt.dbl{flex-direction:column}
.dt.dbl i+i{border-left:0;border-top:1px solid #BFB5A6}
.dhand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dbtn{border-radius:7px;padding:2px}
.dbtn .dt{flex-direction:column}
.dbtn .dt i{width:28px;height:28px;padding:4px}
.dbtn .dt i+i{border-left:0;border-top:1px solid #BFB5A6}
.dbtn:disabled{opacity:.4;cursor:default}
.dbtn.sel{outline:2px solid var(--accent)}
.lboard{display:grid;grid-template-columns:repeat(15,1fr);width:100%;max-width:420px;aspect-ratio:1;margin-inline:auto;background:var(--line);gap:1px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lc{background:var(--surface);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;min-width:0;min-height:0;padding:0}
.lc.bs{background:color-mix(in srgb,var(--lc) 26%,var(--surface))}
.lc.st,.lc.hc{background:color-mix(in srgb,var(--lc) 55%,var(--surface))}
.lc.hm{background:var(--lc)}
.lc.mid{background:var(--soft)}
.tk{width:66%;aspect-ratio:1;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.45)}
.lc.multi .tk{width:42%;border-width:1px}
.lc.mv{outline:2px solid var(--ink);outline-offset:-2px;cursor:pointer;position:relative;z-index:1}
@media (prefers-reduced-motion:no-preference){.lc.mv .tk{animation:a-pulse .6s ease-in-out infinite alternate}}
.die{font-size:2rem;line-height:1}
.rchat{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto}
.rchat:empty{display:none}
.rctl select{width:auto;flex:1;min-width:120px;padding:6px 10px;border-radius:99px}
.iconbtn.rec{background:var(--accent);color:var(--accent-ink)}
.seat.dead b{text-decoration:line-through}
.cd{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:40px;height:56px;background:#FBF7F0;border:1px solid #BFB5A6;border-radius:6px;color:#2E2925;font-size:.95rem;line-height:1.1;flex:none}
.cd b{font-weight:600}
.cd i{font-style:normal;font-size:1.1rem}
.cd.red,.csb.red{color:#B8322A}
.csuit.red{color:#D9534A}
.cd.back{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ctable{display:flex;gap:14px;justify-content:center;align-items:center;background:var(--bg);border-radius:10px;padding:14px}
.ctable .big .cd{width:56px;height:78px;font-size:1.3rem}
.csuit{font-size:2rem;line-height:1}
.chand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cbtn{border-radius:8px;padding:2px}
.cbtn:disabled{opacity:.4;cursor:default}
.cbtn.sel{outline:2px solid var(--accent)}
.csb{font-size:1.2rem;padding:4px 14px}
.tboard{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:2px;aspect-ratio:1;max-width:440px;width:100%;margin-inline:auto}
.tq{background:var(--bg);border-radius:6px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:.56rem;line-height:1.15;text-align:center;overflow:hidden;border-top:4px solid var(--oc,transparent);min-width:0;min-height:0}
.tq b{font-weight:600;overflow-wrap:anywhere}
.tq.sp{background:var(--soft)}
.tks{display:flex;gap:1px;flex-wrap:wrap;justify-content:center;min-height:10px;width:100%}
.tks .tk{width:9px;border-width:1px}
.tmid{grid-area:2/2/6/6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:6px;font-size:.88rem}
.rules{display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.rules ol{margin:0;padding-inline-start:1.4em;display:flex;flex-direction:column;gap:6px}
.sheet h3{font-size:.85rem;font-weight:500;color:var(--muted)}
[hidden]{display:none!important}
</style>

const RULES={
domino:{dz:['كمّل حجراتك قبل الآخرين.','كل لاعب يدّي 7 حجرات، ولي عندو أكبر دوبل يبدا بيه.','في دورك حطّ حجرة فيها نفس الرقم تاع واحد من طرفي السلسلة.','ما عندكش حجرة تصلح؟ تفوّت دورك، ما كاينش سحب.','إذا تبلوكات اللعبة، لي عندو أقل نقاط في يدّو يربح.'],
ar:['أنهِ أحجارك قبل الآخرين.','يأخذ كل لاعب 7 أحجار، ويبدأ صاحب أكبر حجر مزدوج.','في دورك ضع حجراً يحمل نفس رقم أحد طرفي السلسلة.','إن لم يكن لديك حجر مناسب تمرّر دورك، فلا يوجد سحب.','إذا أُغلقت اللعبة يفوز صاحب أقل مجموع نقاط في يده.'],
fr:['Posez tous vos dominos avant les autres.','Chacun reçoit 7 dominos ; le plus gros double commence.','À votre tour, posez un domino qui porte le même chiffre qu’un des deux bouts de la chaîne.','Rien à poser ? Vous passez : il n’y a pas de pioche.','Si le jeu est bloqué, le plus petit total de points en main gagne.'],
en:['Play all your tiles before the others.','Everyone gets 7 tiles; the highest double starts.','On your turn, place a tile that matches the number at either end of the chain.','Nothing fits? You pass: there is no drawing.','If the game is blocked, the lowest total of points in hand wins.']},
ludo:{dz:['وصّل زوج حجراتك للدار في الوسط قبل الآخرين.','لازم يجيك 6 باش تخرّج حجرة من القاعدة، والـ6 تعطيك رمية زايدة.','إذا طحت على حجرة خصم ترجع لقاعدتها، إلا في خانات البداية الملوّنة فهي آمنة.','لازم الرقم بالضبط باش تدخّل الحجرة للدار.'],
ar:['أوصل قطعتيك إلى البيت في الوسط قبل الآخرين.','تحتاج إلى 6 لإخراج قطعة من القاعدة، والـ6 تمنحك رمية إضافية.','إذا نزلت على قطعة خصم عادت إلى قاعدتها، إلا في خانات البداية الملوّنة فهي آمنة.','تحتاج إلى الرقم المضبوط لإدخال القطعة إلى البيت.'],
fr:['Amenez vos deux pions à la maison, au centre, avant les autres.','Il faut un 6 pour sortir un pion de la base, et un 6 donne un lancer de plus.','Tomber sur un pion adverse le renvoie à sa base, sauf sur les cases de départ colorées, qui sont sûres.','Il faut le chiffre exact pour entrer à la maison.'],
en:['Bring both your pieces home to the centre before the others.','You need a 6 to leave the base, and a 6 gives you another roll.','Landing on an opponent sends it back to its base, except on the coloured start squares, which are safe.','You need the exact number to enter home.']},
cards:{dz:['كمّل كوارطك قبل الآخرين.','كل لاعب يدّي 5 كوارط.','العب كارطة بنفس اللون (♠ ♥ ♦ ♣) ولا بنفس الرقم تاع الكارطة لي في الوسط.','الثمانية تتلعب على أي كارطة، وتختار بيها اللون الجديد.','ما عندكش؟ اسحب كارطة: إذا تصلح العبها، وإذا لا يفوت دورك.'],
ar:['أنهِ أوراقك قبل الآخرين.','يأخذ كل لاعب 5 أوراق.','العب ورقة من نفس النوع (♠ ♥ ♦ ♣) أو بنفس رقم الورقة التي في الوسط.','الثمانية تُلعب على أي ورقة، وتختار بها النوع الجديد.','إن لم تجد ورقة فاسحب واحدة: إن صلحت فالعبها، وإلا انتقل الدور.'],
fr:['Videz votre main avant les autres.','Chacun reçoit 5 cartes.','Jouez une carte de la même couleur (♠ ♥ ♦ ♣) ou du même rang que la carte du milieu.','Un 8 se joue sur n’importe quelle carte et vous choisissez la nouvelle couleur.','Rien à jouer ? Piochez une carte : jouez-la si elle convient, sinon le tour passe.'],
en:['Empty your hand before the others.','Everyone gets 5 cards.','Play a card of the same suit (♠ ♥ ♦ ♣) or the same rank as the card in the middle.','An 8 can be played on anything, and you pick the new suit.','Nothing to play? Draw a card: play it if it fits, otherwise the turn passes.']},
trade:{dz:['كون الأغنى (دراهم ومدن) كي تكمل الدورات، ولا خلّي الآخرين يفلّسو.','تبدا بـ 1000 دج. ارمي الزهر وتقدّم، وكل ما تفوت على البداية تدّي 150 دج.','مدينة ما عندها مولى: تقدر تشريها. مدينة تاع لاعب آخر: تخلّصلو الكراء، ربع سومتها.','حظ: تربح ولا تخسر. ضريبة: تخلّص 100. سوق: تدّي 100. واحة: ترتاح.','لي دراهمو يهبطو تحت الصفر يفلّس ويخرج. اللعبة تكمل بعد 15 دور لكل لاعب.'],
ar:['كن الأغنى (نقوداً ومدناً) عند انتهاء الجولات، أو أفلِس الآخرين.','تبدأ بـ 1000 دج. ارمِ النرد وتقدّم، وكلما مررت بالبداية أخذت 150 دج.','مدينة بلا مالك: يمكنك شراؤها. مدينة يملكها لاعب آخر: تدفع له الإيجار، ربع سعرها.','حظ: تربح أو تخسر. ضريبة: تدفع 100. سوق: تأخذ 100. واحة: استراحة.','من ينزل رصيده تحت الصفر يفلس ويخرج. تنتهي اللعبة بعد 15 دوراً لكل لاعب.'],
fr:['Soyez le plus riche (argent et villes) à la fin des tours, ou ruinez les autres.','Vous commencez avec 1000 DA. Lancez le dé et avancez ; chaque passage au départ rapporte 150 DA.','Ville sans propriétaire : vous pouvez l’acheter. Ville d’un autre joueur : vous lui payez un loyer, le quart du prix.','Chance : gain ou perte. Taxe : vous payez 100. Marché : vous recevez 100. Oasis : repos.','Un joueur sous zéro est ruiné et sort. La partie s’arrête après 15 tours par joueur.'],
en:['Be the richest (cash and cities) when the rounds end, or bankrupt the others.','You start with 1000 DA. Roll the die and move; each time you pass Start you get 150 DA.','A city with no owner: you may buy it. A city owned by another player: you pay rent, a quarter of its price.','Chance: win or lose money. Tax: pay 100. Market: get 100. Oasis: rest.','A player below zero is bankrupt and out. The game ends after 15 turns per player.']},
wolf:{dz:['السكان يربحو إذا خرّجو كل الذياب. الذياب يربحو كي يولّو قد الباقيين في العدد.','الأدوار تتوزّع بالسرّ: زوج ذياب (واحد إذا اللاعبين قلال)، شوّاف واحد، والباقي سكان.','في الليل: الذياب ياكلو لاعب، والشوّاف يشوف حقيقة لاعب واحد.','في النهار: كل واحد يصوّت، ولي يدّي أكثر أصوات يخرج. التعادل ما يخرّج حتى واحد.','إذا متّ تبقى تتفرّج حتى تكمل اللعبة.'],
ar:['يفوز القرويون إذا أخرجوا كل الذئاب. تفوز الذئاب حين يساوي عددها عدد الباقين.','توزَّع الأدوار سراً: ذئبان (واحد إذا قلّ اللاعبون)، عرّاف واحد، والبقية قرويون.','في الليل: تفترس الذئاب لاعباً، ويكشف العرّاف حقيقة لاعب واحد.','في النهار: يصوّت الجميع، ويخرج صاحب أكثر الأصوات. التعادل لا يُخرج أحداً.','إذا متّ تبقى متفرّجاً حتى نهاية اللعبة.'],
fr:['Les villageois gagnent s’ils éliminent tous les loups. Les loups gagnent quand ils sont aussi nombreux que les autres.','Les rôles sont secrets : deux loups (un seul si les joueurs sont peu nombreux), une voyante, et des villageois.','La nuit : les loups dévorent un joueur, et la voyante découvre le rôle d’un joueur.','Le jour : tout le monde vote, et le plus désigné sort. En cas d’égalité, personne ne sort.','Si vous mourez, vous regardez la fin de la partie.'],

function domInit(n){const d=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)d.push([a,b]);for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}
  const hands=[];for(let i=0;i<n;i++)hands.push(d.splice(0,7));
  let best=-1,who=0,idx=0;hands.forEach((hd,pl)=>hd.forEach((x,i)=>{const sc=(x[0]===x[1]?100:0)+x[0]+x[1];if(sc>best){best=sc;who=pl;idx=i}}));
  const st={hands,chain:[hands[who].splice(idx,1)[0]],turn:(who+1)%n,passes:0,over:false,winner:null,blocked:false,ask:null,last:{p:who,pass:false}};return st}
const domEnds=st=>[st.chain[0][0],st.chain[st.chain.length-1][1]];

  if(side==='l')st.chain.unshift(x[1]===e[0]?x:[x[1],x[0]]);else st.chain.push(x[0]===e[1]?x:[x[1],x[0]]);
  st.passes=0;st.last={p:pl,pass:false};if(!st.hands[pl].length){st.over=true;st.winner=pl}else st.turn=(pl+1)%st.hands.length}
function domPass(st,pl){st.passes++;st.last={p:pl,pass:true};if(st.passes>=st.hands.length){const sums=st.hands.map(hd=>hd.reduce((s,x)=>s+x[0]+x[1],0));st.over=true;st.blocked=true;st.winner=sums.indexOf(Math.min(...sums))}else st.turn=(pl+1)%st.hands.length}

panel(v){V.panel=v||null;render();const m=$('#main');m.scrollTop=m.scrollHeight},
cemo(){V.cemo=!V.cemo;render()},
emo(v){if(S.tab==='msgs'&&V.chat){V.cdraft+=v;const i=$('#chat-in');if(i){i.value=V.cdraft;i.focus()}}else{V.draft+=v;const d=$('#draft');if(d){d.value=V.draft;d.focus()}const b=$('#postbtn');if(b)b.disabled=false}},
sendst(v){pushMsg({m:1,k:'st',v})},
sendan(v){pushMsg({m:1,k:'an',v})},
pick(){V.pickFor='post';$('#pick').accept='image/*,video/*';$('#pick').click()},
picksell(){V.pickFor='sell';$('#pick').accept='image/*';$('#pick').click()},
pickreel(){V.pickFor='reel';$('#pick').accept='video/*';$('#pick').click()},
cat(v){V.cat=v;render()},
sell(){V.simg=null;V.sheet='sell';render();$('#sl-name').focus()},
hag(v){V.sheet={hag:v};render()},
pdel(v){S.prods=S.prods.filter(p=>p.id!==v);save();render()},
rmimg(){V.dimg=null;V.dvid=null;render()},
feelopen(){V.feelOpen=!V.feelOpen;render()},
feel(v){V.dfeel=V.dfeel===v?null:v;V.feelOpen=false;render()},
post(){const x=V.draft.trim();if(!x&&!V.dimg&&!V.dvid)return;const np={id:'u'+Date.now(),u:'me',t:Date.now(),x,img:V.dimg,vid:V.dvid,feel:V.dfeel,likes:0,cm:[]};if(S.tab==='group')np.g=V.group;if(S.tab==='page')np.pg=V.page;S.posts.push(np);V.draft='';V.dimg=null;V.dvid=null;V.dfeel=null;V.feelOpen=false;save();render();$('#main').scrollTop=0}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el){if(V.menu){V.menu=null;render()}return}
  A[el.dataset.a](el.dataset.v,e,el);
});
document.addEventListener('input',e=>{
  if(e.target.id==='draft'){V.draft=e.target.value;$('#postbtn').disabled=!(V.draft.trim()||V.dimg||V.dvid)}
  if(e.target.id==='chat-in')V.cdraft=e.target.value;
  if(e.target.id==='w-name')V.wname=e.target.value;
  if(e.target.id==='hr')$('#hv').textContent=fmt(e.target.value)+' '+t('da');
  if(e.target.id==='q'){V.q=e.target.value;$('#res').innerHTML=results()}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.dataset.f;
  if(f==='cmt'){const id=e.target.dataset.v,i=$('#c-'+id),x=i.value.trim();if(!x)return;P(id).cm.push({u:'me',x});save();render();const n=$('#c-'+id);n&&n.focus()}
  if(f==='msg'){const i=$('#chat-in'),x=i.value.trim();if(!x)return;V.cdraft='';(S.chats[V.chat]=S.chats[V.chat]||[]).push({m:1,x});save();render();const m=$('#main');m.scrollTop=m.scrollHeight;$('#chat-in').focus()}
  if(f==='welcome'){S.me.name=V.wname.trim().slice(0,40);S.onb=true;V.sheet=null;save();render()}
  if(f==='editp'){const p=P(V.sheet.edit),x=$('#ep').value.trim();if(p&&(x||p.img||p.pic)){if(x!==p.x){p.x=x;p.ed=1}V.sheet=null;save();render()}}
  if(f==='mk'){const k=V.sheet.mk,n=$('#mk-name').value.trim(),d=$('#mk-desc').value.trim();if(!n)return;const id=(k==='page'?'mp':'mg')+Date.now();V.sheet=null;if(k==='page'){S.mypages.push({id,n,d,f:0,mine:1});save();A.page(id)}else{S.mygroups.push({id,n,d,m:0,mine:1});S.joined[id]=1;save();A.group(id)}}
  if(f==='room'){openRoom($('#rm-name').value.trim()||t('r_mine'),GAMES.includes($('#rm-game').value)?$('#rm-game').value:'domino',Object.keys(S.follows))}
  if(f==='rmsg'){const i=$('#room-in'),x=i.value.trim();if(!x||!V.room)return;V.room.chat.push(x);i.value='';const c=$('#rchat');c.innerHTML=rchatHTML();c.scrollTop=c.scrollHeight}
  if(f==='sell'){const n=$('#sl-name').value.trim(),pr=+$('#sl-price').value;if(!n||!(pr>0))return;S.prods.push({id:'s'+Date.now(),u:'me',n,price:Math.round(pr),cat:$('#sl-cat').value,img:V.simg,e:'📦'});V.sheet=null;V.cat='all';save();render()}
  if(f==='hag'){const p=S.prods.find(x=>x.id===V.sheet.hag),x=t('s_msg').replace('{p}',p.n).replace('{o}',fmt($('#hr').value));(S.chats[p.u]=S.chats[p.u]||[]).push({m:1,x});S.read[p.u]=1;V.sheet=null;S.tab='msgs';V.chat=p.u;save();render();const m=$('#main');m.scrollTop=m.scrollHeight}
  if(f==='edit'){S.me.name=$('#ed-name').value.trim();S.me.bio=$('#ed-bio').value.trim();V.sheet=null;save();render()}
});
document.addEventListener('change',e=>{if(e.target.id==='rm-game'){const el=$('#rm-rules');if(el&&GAMES.includes(e.target.value))el.innerHTML=rulesHTML(e.target.value)}if(e.target.id==='rg')A.rgame(e.target.value);if(e.target.id==='rn')A.rcnt(e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&V.sheet)A.close()});
$('#pick').addEventListener('change',e=>{const f=e.target.files[0],m=V.pickFor;e.target.value='';if(!f)return;const isV=f.type.startsWith('video/'),isI=f.type.startsWith('image/');
  if(!(m==='reel'?isV:(m==='post'||m==='gif')?(isV||isI):isI))return;
  if(isV&&m==='post'){V.dvid=URL.createObjectURL(f);V.dimg=null;render();return}
  if(isV&&m==='gif'){pushMsg({m:1,k:'vid',src:URL.createObjectURL(f)});return}
  if(m==='reel'){V.myReels.unshift({id:'m'+Date.now(),v:URL.createObjectURL(f)});render();$('#main').scrollTop=0;return}
  const r=new FileReader();r.onload=()=>{if(m==='sell'){V.simg=r.result;const el=$('#sl-prev');if(el)el.innerHTML=`<span class="pimg sm"><img src="${r.result}" alt=""></span>`}else if(m==='gif')pushMsg({m:1,k:'img',src:r.result});else if(m==='avatar'||m==='cover')shrink(r.result,m==='avatar'?240:900,m==='avatar',d=>{S.me[m==='avatar'?'photo':'cover']=d;save();render()});else{V.dimg=r.result;V.dvid=null;render()}};r.readAsDataURL(f)});
load();if(!S.onb&&!S.me.name)V.sheet='welcome';armRest();render();
/* phone back button: the Android wrapper calls this; true means the page handled it */
window.lammaBack=()=>{if(V.sheet){A.close();return true}if(['user','group','page','room'].includes(S.tab)){A.back();return true}if(S.tab==='msgs'&&V.chat){A.chat('');return true}if(S.tab!=='home'){A.tab('home');return true}return false};
try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('dictation').then(d=>{if(!d)return;DICT=d;
  try{d.onFinal(o=>{const i=$('#room-in'),x=o&&o.text;if(i&&x)i.value=(i.value?i.value+' ':'')+x});
  d.onState(o=>{V.listening=!!o&&o.state==='listening';const b=$('#micbtn');if(b){b.classList.toggle('rec',V.listening);b.setAttribute('aria-pressed',String(V.listening))}})}catch(e){}
  const b=$('#micbtn');if(b)b.hidden=false}).catch(()=>{})}catch(e){}
</script>
</body>
</html>
